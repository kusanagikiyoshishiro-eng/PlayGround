<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Starship Suspects</title>
<style>
:root{--cyan:#55ddd2;--red:#ff5268;--panel:#091522e8}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050b13;color:#edf7ff;font-family:Inter,system-ui,sans-serif}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;gap:9px}.brand{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#20aaa3;border:1px solid #82fff2;box-shadow:0 8px 25px #0008}.brand:after{content:"";width:19px;height:26px;border-radius:9px;background:#c9f6f1;box-shadow:inset 0 0 0 5px #68acae}.status{width:220px;padding:9px 12px;border:1px solid #ffffff18;border-radius:12px;background:var(--panel);backdrop-filter:blur(8px)}.status-row{display:flex;justify-content:space-between;text-transform:uppercase;font-size:11px;letter-spacing:1px;color:#94aabd}.status-row b{color:white}.bar{height:5px;margin-top:7px;border-radius:8px;background:#26384a;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#55ddd2,#b4fff7)}
.role{position:absolute;left:50%;top:max(15px,env(safe-area-inset-top));transform:translateX(-50%);padding:8px 15px;border-radius:30px;background:#091522cc;border:1px solid #ffffff18;font-size:12px;font-weight:900}.role span{color:#55ddd2}.role.impostor span{color:#ff5268}.minimap{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));width:150px;height:150px;border-radius:50%;background:#07131fe8;border:2px solid #88b6c34a;overflow:hidden}
#joystick{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:1px solid #bdf8ff33;background:#07131b77;pointer-events:auto;touch-action:none}#stick{position:absolute;width:48px;height:48px;left:32px;top:32px;border-radius:50%;background:#b9e9ed45;border:2px solid #dffcff88}
.actions{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:10px;pointer-events:auto}.btn{width:72px;height:72px;border:2px solid #ffffff55;border-radius:50%;display:grid;place-content:center;text-align:center;background:linear-gradient(145deg,#26394a,#111d29);color:white;font-size:10px;font-weight:900;line-height:13px;touch-action:none}.btn.primary{background:linear-gradient(145deg,#ff667a,#b92c43);border-color:#ffadb7}.btn:active{transform:scale(.94)}.btn:disabled{opacity:.35;filter:grayscale(1)}
#prompt{position:absolute;left:50%;bottom:max(145px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 13px;border:1px solid #70dcd2;border-radius:9px;background:#07131fee;font-size:12px;opacity:0;transition:.2s}#prompt.show{opacity:1}
#overlay{position:fixed;z-index:30;inset:0;display:none;place-items:center;background:#020713dc;backdrop-filter:blur(8px)}#overlay.show{display:grid}.card{width:min(520px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;text-align:center;background:linear-gradient(145deg,#17283a,#091422);border:1px solid #ffffff25;border-radius:18px;padding:22px;box-shadow:0 25px 80px #000}.card h1{margin:4px 0 8px}.card p{color:#aebecd}.card button{border:0;border-radius:10px;background:#55ddd2;color:#09202a;font-weight:900;padding:12px 18px;pointer-events:auto}.vote-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}.vote{display:flex;align-items:center;gap:8px;background:#101f2e;border:1px solid #ffffff18;border-radius:10px;padding:8px;text-align:left}.vote-dot{width:28px;height:28px;border-radius:50%;flex:none}.vote-name{flex:1;font-size:12px}.vote strong{font-size:11px;color:#ff9dab}.skip{background:#25384a;color:white!important}
@media(max-width:700px){.minimap{width:104px;height:104px}.status{width:170px}.brand{display:none}.role{top:70px}.btn{width:62px;height:62px}.card{padding:16px}.vote-grid{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<canvas id="game"></canvas><div id="hud">
<div class="top"><div class="brand"></div><div class="status"><div class="status-row"><span>Tugas</span><b id="taskText">0 / 7</b></div><div class="bar"><i id="taskBar"></i></div></div></div>
<div id="role" class="role">ROLE <span>SPACECREW</span></div><canvas id="map" class="minimap" width="300" height="300"></canvas><div id="prompt">Tekan E untuk menyelesaikan tugas</div>
<div id="joystick"><div id="stick"></div></div><div class="actions"><button id="taskBtn" class="btn primary">TUGAS</button><button id="killBtn" class="btn">BUNUH</button><button id="reportBtn" class="btn">MEETING</button></div>
</div>
<div id="overlay"><div class="card"><h1 id="modalTitle">Rapat Darurat</h1><p id="modalText">Pilih pemain yang dicurigai.</p><div id="voteGrid" class="vote-grid"></div><button id="again">KEMBALI</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),map=document.getElementById('map'),mctx=map.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
// map is 1.35x wider/taller than a normal screen; rooms have real door gaps and connected corridors
const rooms=[
{name:'KARGO',x:.05,y:.11,w:.18,h:.20,c:'#1d4050',door:['r']},{name:'SECURITY',x:.27,y:.07,w:.16,h:.17,c:'#203744',door:['r','b']},{name:'MEDBAY',x:.48,y:.10,w:.18,h:.19,c:'#29424a',door:['l','r','b']},{name:'REACTOR',x:.79,y:.11,w:.16,h:.23,c:'#283b4a',door:['l']},
{name:'CAFETERIA',x:.30,y:.38,w:.36,h:.24,c:'#1b4149',door:['t','b','l','r']},{name:'WEAPONS',x:.06,y:.52,w:.17,h:.21,c:'#26394a',door:['r','t']},{name:'ADMIN',x:.49,y:.69,w:.19,h:.17,c:'#203747',door:['t','l','r']},{name:'NAVIGATION',x:.73,y:.66,w:.20,h:.19,c:'#1b3a4c',door:['t','l']},{name:'O2',x:.80,y:.38,w:.14,h:.19,c:'#27394a',door:['l','t']}
];
const corridors=[{x:.23,y:.44,w:.07,h:.12},{x:.66,y:.44,w:.14,h:.12},{x:.25,y:.64,w:.24,h:.08},{x:.68,y:.72,w:.05,h:.08},{x:.43,y:.25,w:.09,h:.13},{x:.64,y:.13,w:.15,h:.08},{x:.12,y:.31,w:.12,h:.21},{x:.49,y:.29,w:.12,h:.09},{x:.84,y:.34,w:.08,h:.04},{x:.35,y:.62,w:.06,h:.07}];
let player,botList,tasks,killCooldown=0,won=false,keys={},voting=false,jx=0,jy=0,joy=false;
function reset(){player={x:.47,y:.50,r:13,color:'#55d5c9',impostor:Math.random()<.5};botList=[];const colors=['#efbd55','#ed7474','#9177df','#73abdf','#62c978','#e58bd0','#ed9853'];for(let i=0;i<7;i++)botList.push({name:'Crew '+(i+1),x:.10+Math.random()*.78,y:.12+Math.random()*.72,r:12,color:colors[i],alive:true,dir:Math.random()*6.28,impostor:false});if(!player.impostor)botList[Math.floor(Math.random()*botList.length)].impostor=true;tasks=[{x:.12,y:.19,d:false},{x:.33,y:.12,d:false},{x:.55,y:.16,d:false},{x:.84,y:.18,d:false},{x:.12,y:.61,d:false},{x:.58,y:.75,d:false},{x:.81,y:.72,d:false}];killCooldown=0;won=false;voting=false;document.getElementById('overlay').className='';document.getElementById('role').className='role '+(player.impostor?'impostor':'');document.querySelector('#role span').textContent=player.impostor?'IMPOSTOR':'SPACECREW';updateHUD()}reset();
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joyEl=document.getElementById('joystick'),stick=document.getElementById('stick');function moveJoy(e){const r=joyEl.getBoundingClientRect(),p=e.touches?e.touches[0]:e,dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=34,s=l>m?m/l:1;jx=dx*s/m;jy=dy*s/m;stick.style.transform=`translate(${dx*s}px,${dy*s}px)`}joyEl.onpointerdown=e=>{joy=true;joyEl.setPointerCapture(e.pointerId);moveJoy(e)};joyEl.onpointermove=e=>{if(joy)moveJoy(e)};joyEl.onpointerup=()=>{joy=false;jx=jy=0;stick.style.transform=''};
function blocked(nx,ny){if(nx<.025||nx>.975||ny<.055||ny>.94)return true;let inside=false;for(const r of rooms)if(nx>r.x&&nx<r.x+r.w&&ny>r.y&&ny<r.y+r.h)inside=true;for(const c of corridors)if(nx>c.x&&nx<c.x+c.w&&ny>c.y&&ny<c.y+c.h)inside=true;return !inside}
function nearestTask(){let n=null,d=.065;for(const t of tasks)if(!t.d){let q=Math.hypot(t.x-player.x,t.y-player.y);if(q<d){d=q;n=t}}return n}function updateHUD(){let n=tasks.filter(t=>t.d).length;taskText.textContent=n+' / '+tasks.length;taskBar.style.width=n/tasks.length*100+'%';prompt.classList.toggle('show',!!nearestTask()&&!player.impostor)}
function complete(){if(player.impostor)return;let t=nearestTask();if(t){t.d=true;updateHUD();if(tasks.every(t=>t.d))finish(true,'Semua tugas telah selesai. Spacecrew menang!')}}
function kill(){if(!player.impostor||killCooldown>0)return;let target=null,best=.085;for(const b of botList){if(!b.alive)continue;let d=Math.hypot(b.x-player.x,b.y-player.y);if(d<best){best=d;target=b}}if(target){target.alive=false;target.dead=true;killCooldown=12;if(botList.filter(b=>b.alive).length<=1)finish(false,'Impostor menguasai pesawat!')}}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e')complete();if(e.key.toLowerCase()==='r')meeting()});taskBtn.onclick=complete;killBtn.onclick=kill;reportBtn.onclick=meeting;
function meeting(){if(won||voting)return;voting=true;const grid=document.getElementById('voteGrid');grid.innerHTML='';for(const b of botList){if(!b.alive)continue;const el=document.createElement('button');el.className='vote';el.innerHTML=`<i class="vote-dot" style="background:${b.color}"></i><span class="vote-name">${b.name}</span><strong>VOTE</strong>`;el.onclick=()=>castVote(b);grid.appendChild(el)}const skip=document.createElement('button');skip.className='vote skip';skip.innerHTML='<span class="vote-name">Lewati voting</span><strong>SKIP</strong>';skip.onclick=()=>castVote(null);grid.appendChild(skip);modalTitle.textContent='Rapat Darurat';modalText.textContent='Pilih pemain yang dicurigai.';again.style.display='none';overlay.className='show'}
function castVote(target){const all=[player,...botList.filter(b=>b.alive)],votes={};all.forEach(v=>{if(v===player&&target) votes[target.name]=(votes[target.name]||0)+1;else if(Math.random()<.5&&target)votes[target.name]=(votes[target.name]||0)+1;else{const pick=botList.filter(b=>b.alive)[Math.floor(Math.random()*botList.filter(b=>b.alive).length)];if(pick&&target!==pick)votes[pick.name]=(votes[pick.name]||0)+1}});let max=0,winner=null;Object.entries(votes).forEach(([n,v])=>{if(v>max){max=v;winner=n}});let victim=winner==='Kamu'?player:botList.find(b=>b.name===winner);if(victim&&victim!==player){victim.alive=false;victim.dead=true;if(victim.impostor){finish(true,'Impostor berhasil tereliminasi. Spacecrew menang!');return}}else if(target===botList.find(b=>b.impostor)){finish(true,'Impostor berhasil tereliminasi. Spacecrew menang!');return}voting=false;overlay.className='';if(botList.filter(b=>b.alive).length<=1)finish(false,'Impostor mengambil alih pesawat!')}
function finish(win,text){won=true;modalTitle.textContent=win?'Spacecrew Menang':'Impostor Menang';modalText.textContent=text;again.style.display='inline-block';overlay.className='show'}again.onclick=reset;
let last=performance.now();function loop(now){let dt=Math.min(.032,(now-last)/1000);last=now;if(!won&&!voting)update(dt);draw(now/1000);requestAnimationFrame(loop)}
function update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+jx,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+jy,l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}let speed=.30,nx=player.x+dx*speed*dt,ny=player.y+dy*speed*dt;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;killCooldown=Math.max(0,killCooldown-dt);killBtn.disabled=!player.impostor||killCooldown>0;
for(const b of botList){if(!b.alive)continue;b.dir+=(Math.random()<.018?(Math.random()-.5)*2.4:0)*dt;b.x+=Math.cos(b.dir)*.018*dt;b.y+=Math.sin(b.dir)*.018*dt;if(blocked(b.x,b.y)){b.dir+=Math.PI*.75+(Math.random()-.5)}}updateHUD}
function draw(t){ctx.fillStyle='#060d16';ctx.fillRect(0,0,W,H);let ox=W/2-player.x*W,oy=H/2-player.y*H;
ctx.strokeStyle='#183141';ctx.lineWidth=1;for(let x=-W;x<W*2;x+=72){ctx.beginPath();ctx.moveTo(x+ox%72,0);ctx.lineTo(x+ox%72,H);ctx.stroke()}for(let y=-H;y<H*2;y+=72){ctx.beginPath();ctx.moveTo(0,y+oy%72);ctx.lineTo(W,y+oy%72);ctx.stroke()}
for(const c of corridors){ctx.fillStyle='#10212d';ctx.fillRect(c.x*W+ox,c.y*H+oy,c.w*W,c.h*H);ctx.strokeStyle='#55707a';ctx.lineWidth=2;ctx.strokeRect(c.x*W+ox,c.y*H+oy,c.w*W,c.h*H)}
for(const r of rooms){let x=r.x*W+ox,y=r.y*H+oy,w=r.w*W,h=r.h*H;ctx.fillStyle=r.c;ctx.fillRect(x,y,w,h);ctx.strokeStyle='#91bec6aa';ctx.lineWidth=3;ctx.strokeRect(x+4,y+4,w-8,h-8);ctx.fillStyle='#bdd0d599';ctx.font='800 13px system-ui';ctx.fillText(r.name,x+12,y+25)}
for(const z of tasks){let x=z.x*W+ox,y=z.y*H+oy;ctx.fillStyle=z.d?'#3b9f8b':'#dfc36d';ctx.beginPath();ctx.arc(x,y,z.d?7:9,0,7);ctx.fill();ctx.fillStyle='#14212a';ctx.fillRect(x-3,y-3,6,6)}
for(const b of botList){if(!b.alive){ctx.fillStyle='#cadbe0';ctx.fillRect(b.x*W+ox-12,b.y*H+oy-2,24,5);continue}crew(b.x*W+ox,b.y*H+oy,b.color,b.imposter,t)}crew(player.x*W+ox,player.y*H+oy,player.impostor?'#ff5570':'#55d5c9',player.impostor,t,true);drawMap()} 
function crew(x,y,color,imposter,t,main=false){ctx.save();ctx.translate(x,y);ctx.rotate(main?Math.sin(t*5)*.05:0);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,16,16,5,0,0,7);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-13,-18,26,34,11);ctx.fill();ctx.fillStyle='#9ddae3';ctx.beginPath();ctx.roundRect(-3,-13,16,11,5);ctx.fill();ctx.strokeStyle='#12212a';ctx.lineWidth=2;ctx.stroke();ctx.restore()} 
function drawMap(){mctx.clearRect(0,0,300,300);mctx.fillStyle='#091522';mctx.fillRect(0,0,300,300);for(const r of rooms){mctx.fillStyle=r.c;mctx.fillRect(r.x*300,r.y*300,r.w*300,r.h*300)}for(const c of corridors)mctx.fillRect(c.x*300,c.y*300,c.w*300,c.h*300);mctx.fillStyle='#55ddd2';mctx.beginPath();mctx.arc(player.x*300,player.y*300,7,0,7);mctx.fill();for(const b of botList){if(!b.alive)continue;mctx.fillStyle='#ffc85a';mctx.beginPath();mctx.arc(b.x*300,b.y*300,4,0,7);mctx.fill()}}
requestAnimationFrame(loop);
</script></body></html>
