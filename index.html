<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alliance: Skibidi Defense</title>
  <style>
    :*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:#070913;color:white;user-select:none}.hidden{display:none!important}canvas{display:block;width:100%;height:100%}
    #game{position:absolute;inset:0}.screen{position:absolute;inset:0}.vignette:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 180px rgba(0,0,0,.85)}
    #lobby{background:radial-gradient(circle at 72% 44%,#23385b 0,#10182b 38%,#070914 76%)}
    .topbar{position:absolute;left:0;right:0;top:0;height:74px;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(3,5,12,.92),transparent)}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border:3px solid #70bfff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 20px #1b77e9}.logo:before{content:"▣";font-size:22px}.brand h1{font-size:18px;margin:0;letter-spacing:2px}.brand small{color:#9aaccd;font-size:10px;letter-spacing:3px}
    .coins{display:flex;gap:10px}.coin{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid #293b60;border-radius:7px;background:rgba(8,15,31,.72);font-weight:bold}.coin i{width:18px;height:18px;border-radius:50%;background:#54a8ff;box-shadow:0 0 10px #277ce8}.coin:nth-child(2) i{background:#f6c74a}
    .lobby-main{position:absolute;left:0;right:0;bottom:0;top:74px;display:flex;align-items:center}.hero-wrap{width:58%;height:100%;display:flex;align-items:center;justify-content:center}.hero-stage{position:relative;width:min(520px,78%);aspect-ratio:1}.orb{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 50 43%,rgba(74,151,255,.28),rgba(23,49,88,.12) 45%,transparent 70%);border:1px solid rgba(100,175,255,.12);box-shadow:0 0 60px rgba(40,116,210,.12)}
    .main-character{position:absolute;width:210px;height:330px;left:50%;bottom:12%;transform:translateX(-50%)}.c-body{position:absolute;width:150px;height:100px;left:30px;bottom:32px;border-radius:28px 28px 44px 44px;background:linear-gradient(135deg,#4f5e70,#1d2635);border:4px solid #73879c}.c-head{position:absolute;width:120px;height:120px;left:45px;top:18px;border-radius:50%;background:#d6dde5;border:6px solid #202939;box-shadow:inset -12px -8px 18px #8992a0}.camera-lens{position:absolute;width:74px;height:74px;left:23px;top:23px;border-radius:50%;background:radial-gradient(circle,#8ad7ff 0 8%,#182a43 9% 27%,#080b12 28% 63%,#3b4a60 64%);border:6px solid #111722}.c-arm{position:absolute;width:38px;height:150px;bottom:40px;background:#26384d;border:3px solid #657891;border-radius:18px}.c-arm.left{left:8px;transform:rotate(12deg)}.c-arm.right{right:8px;transform:rotate(-12deg)}.c-leg{position:absolute;width:46px;height:95px;bottom:0;background:#1c2635;border:3px solid #58677a;border-radius:12px}.c-leg.left{left:48px}.c-leg.right{right:48px}.floor{position:absolute;width:420px;height:100px;left:50%;bottom:2%;transform:translateX(-50%) perspective(300px) rotateX(58deg);border-radius:50%;border:1px solid rgba(76,139,224,.15);background:repeating-radial-gradient(circle,rgba(67,112,168,.12) 0 2px,transparent 3px 20px)}
    .menu-panel{width:42%;padding-right:5%;display:flex;flex-direction:column;gap:14px}.mode-label{color:#65aef4;font-size:11px;letter-spacing:5px}.mode-title{font-size:44px;font-weight:900;line-height:1;margin:5px 0 10px;text-transform:uppercase}.mode-title span{color:#62aeff}.btn{border:0;color:white;font-weight:800;text-transform:uppercase;letter-spacing:2px;cursor:pointer}.play-btn{width:260px;height:68px;border-radius:10px;font-size:20px;background:linear-gradient(135deg,#1a77db,#4eb1ff);box-shadow:0 12px 35px rgba(24,116,217,.35),inset 0 1px rgba(255,255,255,.35);clip-path:polygon(7% 0,100% 0,93% 100%,0 100%)}.play-btn:hover{filter:brightness(1.15)}
    .secondary{display:flex;gap:10px}.secondary button{height:52px;padding:0 24px;border:1px solid #314765;border-radius:8px;background:rgba(13,24,44,.88);color:#cbd7eb;letter-spacing:1px}.secondary button.active{border-color:#58aaff;color:white;background:rgba(34,86,145,.55)}
    #characterScreen{background:rgba(5,8,17,.96)}.chars{position:absolute;inset:100px 55px 50px;display:grid;grid-template-columns:240px 1fr 280px;gap:24px}.race-list{display:flex;flex-direction:column;gap:10px}.race{height:112px;border:1px solid #293a54;border-radius:10px;background:#101725;display:flex;align-items:center;padding:12px;gap:12px;color:#aebbd0;cursor:pointer}.race.selected{border-color:#57aaff;background:linear-gradient(90deg,rgba(45,111,181,.55),rgba(13,23,41,.75));color:white}.race-icon{width:78px;height:78px;border-radius:8px;background:#1d2a3d;display:grid;place-items:center;font-size:38px}.race-name{font-weight:900;font-size:16px}.race-name small{display:block;color:#7d91ab;font-size:9px;margin-top:5px}.preview{position:relative;border:1px solid #1c2b43;border-radius:14px;background:radial-gradient(circle,#263f65,#0c1423 65%,#080b12)}.preview-name{position:absolute;top:25px;left:30px;font-size:28px;font-weight:900}.preview-name small{display:block;font-size:10px;color:#58aaff;margin-top:5px}.big-preview{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(1.35)}.stats{padding:25px;border:1px solid #1e2d45;border-radius:12px;background:rgba(9,15,28,.84)}.stats h3{margin:0 0 22px;font-size:13px;color:#73aff1}.stat{margin:16px 0}.stat-label{display:flex;justify-content:space-between;font-size:11px;color:#aab8cd;margin-bottom:7px}.bar{height:7px;background:#202d40;border-radius:5px}.bar i{height:100%;display:block;border-radius:5px;background:linear-gradient(90deg,#277dcf,#78c9ff)}.punch-list{margin-top:22px}.punch-list h4{font-size:11px;color:#73aff1}.punch{height:55px;border:1px solid #29394d;border-radius:8px;padding:8px 10px;margin-top:8px;display:flex;align-items:center;gap:10px}.punch span{width:36px;height:36px;border-radius:7px;background:#26384f;display:grid;place-items:center}.punch b{font-size:11px}.back{position:absolute;top:22px;left:24px;height:42px;padding:0 18px;background:#101927;border:1px solid #31445f;border-radius:7px;color:white}
    #hud{pointer-events:none}.hud-top{position:absolute;left:20px;top:18px;display:flex;gap:8px}.health{width:220px;height:48px;background:rgba(7,12,23,.82);border:1px solid #31445e;border-radius:8px;padding:8px 12px}.health label{font-size:9px;color:#9fb1c9}.hpbar{height:8px;margin-top:7px;background:#351922;border-radius:5px}.hpbar i{display:block;height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,#df3f50,#ff8790);transition:.25s}
    #joystick{position:absolute;left:32px;bottom:35px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(174,213,255,.23);background:rgba(11,18,31,.38);pointer-events:auto;touch-action:none}.stick{position:absolute;width:64px;height:64px;left:43px;top:43px;border-radius:50%;border:2px solid rgba(207,232,255,.55);background:rgba(91,145,202,.38);box-shadow:0 5px 20px rgba(0,0,0,.25)}
    .actions{position:absolute;right:28px;bottom:30px;width:190px;height:190px;pointer-events:auto}.action{position:absolute;border-radius:50%;border:2px solid rgba(210,232,255,.5);color:white;display:grid;place-items:center;text-align:center;font-weight:900;cursor:pointer;background:rgba(35,50,73,.75);box-shadow:0 7px 20px rgba(0,0,0,.35)}.punch-btn{width:92px;height:92px;right:0;bottom:0;font-size:12px}.skill-btn{width:82px;height:82px;left:12px;top:14px;font-size:10px}.action small{display:block;font-size:9px;color:#a8bfe0}.action.cool{filter:grayscale(.7);opacity:.72}.coolring{position:absolute;inset:-5px;border-radius:50%;border:3px solid #66baff;border-top-color:transparent;display:none}.action.cool .coolring{display:block}
    #wave{position:absolute;left:50%;top:18px;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000}.wave-title{font-size:12px;letter-spacing:4px}.wave-title b{color:#69b1f5}.enemy-counter{font-size:10px;color:#b6c3d6;margin-top:5px}.toast{position:absolute;left:50%;top:80px;transform:translate(-50%,-20px);padding:10px 18px;border-radius:8px;background:rgba(10,19,34,.9);border:1px solid #3c607f;opacity:0;transition:.25s;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:800px){.topbar{height:58px;padding:8px 12px}.brand h1{font-size:12px}.brand small{display:none}.logo{width:38px;height:38px}.coins .coin:nth-child(2){display:none}.lobby-main{top:58px}.hero-wrap{width:54%}.hero-stage{width:100%}.main-character{transform:translateX(-50%) scale(.72);bottom:18%}.menu-panel{width:46%;padding-right:12px}.mode-title{font-size:28px}.play-btn{width:210px;height:58px}.secondary button{padding:0 10px;font-size:10px}.chars{inset:72px 12px 12px;grid-template-columns:150px 1fr 190px;gap:8px}.race{height:82px;padding:6px}.race-icon{width:48px;height:48px;font-size:25px}.race-name{font-size:11px}.stats{padding:12px}.preview-name{font-size:18px}.big-preview{transform:translate(-50%,-50%) scale(.9)}#joystick{left:18px;bottom:25px;width:120px;height:120px}.stick{left:38px;top:38px;width:44px;height:44px}.actions{right:12px;bottom:18px;transform:scale(.82);transform-origin:right bottom}}
  </style>
</head>
<body>
<div id="app">
  <div id="lobby" class="screen vignette">
    <div class="topbar"><div class="brand"><div class="logo"></div><div><h1>ALLIANCE DEFENSE</h1><small>UNIT COMMAND</small></div></div><div class="coins"><div class="coin"><i></i><span id="coins">1,250</span></div><div class="coin"><i></i><span>85</span></div></div></div>
    <div class="lobby-main"><div class="hero-wrap"><div class="hero-stage"><div class="orb"></div><div class="floor"></div><div id="lobbyCharacter" class="main-character"><div class="c-arm left"></div><div class="c-arm right"></div><div class="c-leg left"></div><div class="c-leg right"></div><div class="c-body"></div><div class="c-head"><div class="camera-lens"></div></div></div></div></div>
      <div class="menu-panel"><div class="mode-label">OPERATION</div><div class="mode-title">SKIBIDI<br><span>DEFENSE</span></div><button id="play" class="btn play-btn">▶ PLAY</button><div class="secondary"><button id="characterBtn" class="active">CHARACTER</button><button>LOADOUT</button></div></div>
    </div>
  </div>
  <div id="characterScreen" class="screen hidden"><button id="back" class="back">← BACK</button><div class="chars"><div class="race-list" id="raceList"></div><div class="preview"><div class="preview-name" id="previewName"></div><div id="bigPreview" class="main-character big-preview"></div></div><div class="stats"><h3>UNIT INFORMATION</h3><div id="stats"></div><div class="punch-list"><h4>PUNCH TECHNIQUE</h4><div class="punch"><span>拳</span><div><b id="punchName">Power Strike</b><br><small id="punchDamage">Damage: 25</small></div></div></div></div></div></div>
  <div id="gameScreen" class="screen hidden"><canvas id="canvas"></canvas><div id="hud"><div class="hud-top"><div class="health"><label id="unitName">CAMERAMAN</label><div class="hpbar"><i id="hpFill"></i></div></div></div><div id="wave"><div class="wave-title">WAVE <b id="waveNum">1</b></div><div class="enemy-counter">TOILET MUSUH <b id="enemyCount">0</b></div></div><div id="toast" class="toast"></div><div id="joystick"><div class="stick" id="stick"></div></div><div class="actions"><div id="skill" class="action skill-btn"><div><b id="skillName">—</b><small id="skillStatus">SKILL</small></div><div class="coolring"></div></div><div id="punch" class="action punch-btn"><div><b>PUNCH</b></div></div></div></div></div>
</div>
<script>
const $=s=>document.querySelector(s); let selected='camera';
const units={camera:{name:'CAMERAMAN',type:'Kamera',hp:100,damage:25,speed:82,armor:50,range:20,skill:null,skillName:'NO SKILL'},speaker:{name:'SPEAKERMAN',type:'Speaker',hp:115,damage:22,speed:88,armor:38,range:16,skill:'sound',skillName:'SOUNDWAVE',cd:15,duration:4},tv:{name:'TVMAN',type:'Televisi',hp:90,damage:20,speed:76,armor:65,range:22,skill:'blue',skillName:'BLUE SCREEN',cd:25,duration:6}};
function characterHTML(type){if(type==='speaker')return `<div class="c-arm left"></div><div class="c-arm right"></div><div class="c-leg left"></div><div class="c-leg right"></div><div class="c-body"></div><div class="c-head" style="border-radius:18px;background:#1a2029"><div style="position:absolute;width:88px;height:88px;left:10px;top:10px;border-radius:50%;border:8px solid #6c7d90;background:radial-gradient(circle,#d5e2ec 0 12%,#293749 13% 30%,#0c1016 31% 48%,#26384b 49%)"></div></div>`;if(type==='tv')return `<div class="c-arm left"></div><div class="c-arm right"></div><div class="c-leg left"></div><div class="c-leg right"></div><div class="c-body"></div><div class="c-head" style="border-radius:8px;background:#273849;border:7px solid #111820;width:128px;height:100px;top:25px;left:41px"><div style="position:absolute;inset:13px;border:3px solid #86b8ff;border-radius:4px;background:radial-gradient(circle,#68bfff,#183d67 70%)"></div></div>`;return `<div class="c-arm left"></div><div class="c-arm right"></div><div class="c-leg left"></div><div class="c-leg right"></div><div class="c-body"></div><div class="c-head"><div class="camera-lens"></div></div>`}
function renderList(){const icons={camera:'◉',speaker:'▰',tv:'▣'};$('#raceList').innerHTML=Object.entries(units).map(([k,u])=>`<div class="race ${k===selected?'selected':''}" data-race="${k}"><div class="race-icon">${icons[k]}</div><div class="race-name">${u.name}<small>RACE / ${u.type.toUpperString?u.type.toUpperString():u.type.toUpperCase()}</small></div></div>`).join('');document.querySelectorAll('.race').forEach(r=>r.onclick=()=>{selected=r.dataset.race;renderList();renderUnit()})}
function renderUnit(){const u=units[selected];$('#previewName').innerHTML=`${u.name}<small>ALLIED UNIT / ${u.type.toUpperCase()}</small>`;$('#bigPreview').innerHTML=characterHTML(selected);$('#stats').innerHTML=[['HEALTH',u.hp,100],['DAMAGE',u.damage,100],['MOVEMENT SPEED',u.speed,100],['ARMOR',u.armor,100],['ATTACK RANGE',u.range,100]].map(x=>`<div class="stat"><div class="stat-label"><span>${x[0]}</span><b>${x[1]}</b></div><div class="bar"><i style="width:${Math.min(100,x[1])}%"></i></div></div>`).join('');$('#punchDamage').textContent='Damage: '+u.damage}
$('#characterBtn').onclick=()=>{$('#lobby').classList.add('hidden');$('#characterScreen').classList.remove('hidden');renderList();renderUnit()};$('#back').onclick=()=>{$('#characterScreen').classList.add('hidden');$('#lobby').classList.remove('hidden');$('#lobbyCharacter').innerHTML=characterHTML(selected)};
const canvas=$('#canvas'),ctx=canvas.getContext('2d');let W,H,dpr,game=false,keys={},joy={x:0,y:0},skillReady=true,skillUntil=0,skillActive=false,punchUntil=0,wave=1,enemies=[],hp=100,last=performance.now(),world={x:0,y:0},blueScreen=false;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);
function start(){resize();$('#lobby').classList.add('hidden');$('#characterScreen').classList.add('hidden');$('#gameScreen').classList.remove('hidden');game=true;world={x:0,y:0};hp=units[selected].hp;skillReady=true;skillActive=false;blueScreen=false;spawnWave();updateHUD();requestAnimationFrame(loop)}
$('#play').onclick=start;
function spawnWave(){enemies=[];for(let i=0;i<3+wave;i++){let a=Math.random()*Math.PI*2,r=280+Math.random()*220;enemies.push({x:world.x+Math.cos(a)*r,y:world.y+Math.sin(a)*r,hp:70+wave*15,stun:0,glasses:Math.random()<.3})}}updateHUD=()=>{$('#unitName').textContent=units[selected].name;$('#skillName').textContent=units[selected].skillName;$('#skillStatus').textContent=units[selected].skill?'READY':'—';$('#skill').classList.toggle('cool',!skillReady);$('#waveNum').textContent=wave;$('#enemyCount').textContent=enemies.length;$('#hpFill').style.width=(hp/units[selected].hp*100)+'%'};
function showToast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>x.classList.remove('show'),1600)}
const joyEl=$('#joystick'),stick=$('#stick');let joyId=null;function joyMove(e){let p=e.touches?e.touches[0]:e,r=joyEl.getBoundingRect?joyEl.getBoundingClientRect():joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=p.clientX-cx,dy=p.clientY-cy,max=r.width*.32,l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}joyEl.addEventListener('pointerdown',e=>{joyId=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});joyEl.addEventListener('pointerup',()=>{joyId=null;joy={x:0,y:0};stick.style.transform='translate(0,0)' });
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
$('#punch').onpointerdown=e=>{e.prevent; punch()};$('#skill').onpointerdown=e=>{e.prevent; useSkill()};
function punch(){if(performance.now()<punchUntil)return;punchUntil=performance.now()+500;let hit=false;for(const en of enemies){let d=Math.hypot(en.x-world.x,en.y-world.y);if(d<80&&en.stun<=0){en.hp-=units[selected].damage;hit=true;if(en.hp<=0)en.killed=true}}enemies=enemies.filter(e=>!e.killed);if(hit)showToast('PUNCH!');updateHUD()}
function useSkill(){if(!skillReady||!units[selected].skill)return;if(units[selected].skill==='sound'){skillReady=false;skillActive=true;skillUntil=performance.now()+4000;let hit=0;for(const en of enemies){let d=Math.hypot(en.x-world.x,en.y-world.y);if(d<260){en.hp-=50;hit++;if(en.hp<=0)en.killed=true}}enemies=enemies.filter(e=>!e.killed);showToast(hit?'SOUNDWAVE DAMAGE 50':'SOUNDWAVE ATTACK');setTimeout(()=>skillActive=false,4000);setTimeout(()=>{skillReady=true;updateHUD()},15000)}else{skillReady=false;blueScreen=true;skillUntil=performance.now()+6000;showToast('BLUE SCREEN');for(const en of enemies){if(!en.glasses&&Math.hypot(en.x-world.x,en.y-world.y)<360)en.stun=skillUntil}setTimeout(()=>blueScreen=false,6000);setTimeout(()=>{skillReady=true;updateHUD()},25000)}updateHUD()}
function updateCD(){if(!skillReady){const u=units[selected];const el=$('#skillStatus');let left=blueScreen||skillActive?Math.max(0,(skillUntil-performance.now())/1000):0;if(skillActive||blueScreen)el.textContent=left.toFixed(1)+'s / ACTIVE';else el.textContent='COOLDOWN'} }
function loop(now){if(!game)return;let dt=Math.min(.033,(now-last)/1000);last=now;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y,l=Math.hypot(dx,dy)||1;if(l>1){dx/=l;dy/=l}world.x+=dx*units[selected].speed*dt*3;world.y+=dy*units[selected].speed*dt*3;
for(const en of enemies){let d=Math.hypot(en.x-world.x,en.y-world.y);if(en.stun>now)continue;if(d<W*.7){let a=Math.atan2(world.y-en.y,world.x-en.x);en.x+=Math.cos(a)*22*dt;en.y+=Math.sin(a)*22*dt;if(d<45){hp-=8*dt}}if(d<40&&punchUntil>now){} }hp=Math.max(0,hp);if(hp<=0){showToast('UNIT DOWN — RETRY');hp=units[selected].hp;world={x:0,y:0}}
if(enemies.length===0){wave++;spawnWave();showToast('WAVE '+wave)}draw(now);updateCD();$('#hpFill').style.width=(hp/units[selected].hp*100)+'%';requestAnimationFrame(loop)}
function draw(now){ctx.clearRect(0,0,W,H);let grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#111827');grd.addColorStop(1,'#080b13');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-world.x,H/2-world.y);ctx.fillStyle='#151d2a';ctx.fillRect(world.x-900,world.y-900,1800,1800);ctx.strokeStyle='rgba(85,130,175,.11)';ctx.lineWidth=1;for(let x=-900;x<=900;x+=60){ctx.beginPath();ctx.moveTo(x,world.y-900);ctx.lineTo(x,world.y+900);ctx.stroke()}for(let y=-900;y<=900;y+=60){ctx.beginPath();ctx.moveTo(world.x-900,y);ctx.lineTo(world.x+900,y);ctx.stroke()}
for(const en of enemies){ctx.save();ctx.translate(en.x,en.y);if(en.stun>now){ctx.fillStyle='rgba(50,130,255,.25)';ctx.beginPath();ctx.arc(0,0,75,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#58aaff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,62,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#d6d1bd';ctx.beginPath();ctx.ellipse(0,-2,30,38,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9f9a84';ctx.fillRect(-24,26,48,18);ctx.fillStyle='#191e25';ctx.beginPath();ctx.ellipse(0,-12,28,20,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dce6e8';ctx.beginPath();ctx.arc(-10,-13,7,0,Math.PI*2);ctx.arc(10,-13,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-10,-13,3,0,Math.PI*2);ctx.arc(10,-13,3,0,Math.PI*2);ctx.fill();ctx.restore()}
