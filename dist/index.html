<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Skibidi City Battle</title><link rel="stylesheet" href="/src/style.css"/></head><body>
<div id="game"><canvas id="gameCanvas"></canvas><div id="vignette"></div>
<section id="lobby" class="screen active">
  <div class="lobby-bg"></div><header class="topbar"><div class="brand"><span class="brandmark">S</span><div><small>SKIBIDI</small><strong>CITY BATTLE</strong></div></div><div class="profile"><span>LV. 12</span><div class="avatar">👤</div></div></header>
  <div class="hero-card"><div class="eyebrow">SEASON 01</div><h1>TOILET<br/><em>INVASION</em></h1><p>Defend the city from the infected toilets.</p><div class="hero-actions"><button id="playBtn" class="primary"><span>▶</span> PLAY</button><button id="characterBtn" class="secondary"><span>♙</span> CHARACTER</button></div></div>
  <aside class="stats-panel"><div class="stat"><small>WINS</small><b id="wins">128</b></div><div class="stat"><small>KILLS</small><b id="kills">842</b></div><div class="stat"><small>RANK</b><b>GOLD II</b></div></aside>
  <nav class="bottomnav"><button class="nav active">⌂<small>HOME</small></button><button class="nav">▣<small>MODES</small></button><button class="nav">◈<small>REWARDS</small></button></nav>
</section>
<section id="character" class="screen"><header class="screen-header"><button class="back" data-back="lobby">‹</button><div><small>SELECT</small><h2>CHARACTER</h2></div></header>
 <div class="character-layout"><div class="race-tabs"><button class="race active" data-race="camera"><div class="race-icon camera">●</div><span>CAMERA</span></button><button class="race" data-race="speaker"><div class="race-icon speaker">◉</div><span>SPEAKER</span></button><button class="race" data-race="tv"><div class="race-icon tv">▣</div><span>TV</span></button></div>
 <div class="model-view"><div id="modelPreview"><div class="preview-shadow"></div><div id="previewUnit" class="unit camera-preview"><div class="head"><i></i></div><div class="body"></div><div class="legs"><b></b><b></b></div></div></div><div class="nameplate"><small id="raceTitle">RACE 01</small><h2 id="unitName">CAMERAMAN</h2></div></div>
 <aside class="character-info"><h3>STATS</h3><div class="statrow"><span>HEALTH</span><div><i id="healthBar"></i></div><b id="healthVal">100</b></div><div class="statrow"><span>DAMAGE</span><div><i id="damageBar"></i></div><b id="damageVal">25</b></div><div class="statrow"><span>SPEED</span><div><i id="speedBar"></i></div><b id="speedVal">85</b></div><div class="ability" id="abilityInfo"><small>SPECIAL</small><b>NO SPECIAL SKILL</b><p>Balanced fighter with fast attacks.</p></div><button id="punchBtn" class="punch">👊 PUNCH</button><button id="selectBtn" class="primary select"><span>✓</span> SELECT</button></aside></div>
</section>
<section id="hud" class="screen">
 <header class="gamehud"><div class="hp"><small id="hudName">CAMERAMAN</small><div class="hpbar"><i id="hpFill"></i></div></div><div class="score"><small>SCORE</small><b id="score">0</b></div></header>
 <div id="crosshair"></div><div id="hitmarker">✦</div><div id="waveNotice"><small>WAVE</small><b id="waveNum">1</b></div>
 <div id="joystick" class="joystick"><div id="stick"></div></div><div class="action-stack"><button id="skillBtn" class="skill"><span id="skillIcon">—</span><small id="skillLabel">SKILL</small><b id="cooldown"></b></button><button id="gamePunch" class="game-punch">👊<small>PUNCH</small></button></div>
 <button id="leaveBtn" class="leave">EXIT</button>
</section>
</div><script type="module" src="/src/main.js"></script></body></html>
